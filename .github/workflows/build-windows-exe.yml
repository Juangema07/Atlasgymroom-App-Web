name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build-windows-exe.yml'
permissions:
  contents: write
jobs:
  windows-exe:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build installer
        run: npm run app:desktop:dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Atlasgymroom-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows installer in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v0.2.0
          name: Atlasgymroom Windows v0.2.0
          body: Instalador de escritorio para Windows x64. Se conecta a la aplicación web alojada y requiere conexión a internet.
          files: release/*.exe
          make_latest: false
