name: Build companion apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build-companion-apps.yml'

permissions:
  contents: read
jobs:
  android-apk:
    name: Android APK (debug / pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: atlasgymroom-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    name: Windows installer EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run app:desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: atlasgymroom-windows-x64-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
