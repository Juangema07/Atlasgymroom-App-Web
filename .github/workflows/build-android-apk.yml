name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: write
jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Atlasgymroom-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.2.0
          name: Atlasgymroom Android v0.2.0
          body: Instalador APK de prueba para Android. Requiere conexión a internet y usa la aplicación web alojada.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
