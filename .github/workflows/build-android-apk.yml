name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: write
jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build bundled Android interface
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: https://zkjzdbwbkoxfsgzqzrqf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4FHQKbOeCK-IgJ6ncxa99Q_bl0-oZMY
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Atlasgymrun-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.2.0
          name: Atlasgymrun Android v0.2.0
          body: APK de Atlasgymrun con interfaz empaquetada localmente. La información se comparte con la web mediante Supabase; las operaciones offline se guardan en el dispositivo y se sincronizan al recuperar Internet.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
